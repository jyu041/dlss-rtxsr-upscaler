name: Bug report
description: Report a reproducible problem with the application or a backend.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not upload proprietary NVIDIA/runtime DLLs, SDK archives, approval manifests containing sensitive information, private source videos, API keys, credentials, or other sensitive files. Redact personal filesystem paths and identifying information where appropriate.
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What went wrong?
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend affected
      options:
        - RTX VSR
        - DLSS SR
        - DLSS 5
        - UI / general
        - unsure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence of steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / error
      render: text
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model
      placeholder: NVIDIA GeForce RTX 3070 8 GB
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: NVIDIA driver version
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Application commit / version
      description: Run `git rev-parse --short HEAD`.
      placeholder: abc1234
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: Runtime state
      description: State whether the required runtime and self-test report as available. Do not attach runtime files.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and diagnostics
      description: Paste redacted logs or diagnostics as plain text.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Optional screenshots
      description: Add screenshots only after checking for private or identifying information.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues.
          required: true
        - label: I read the relevant setup/troubleshooting documentation.
          required: true
        - label: I have not attached proprietary runtimes, credentials, or private media.
          required: true
