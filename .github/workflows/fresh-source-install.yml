name: fresh-source-install

on:
  push:
    branches:
      - main
    paths:
      - "setup.bat"
      - "start.bat"
      - "environment.yml"
      - "requirements.txt"
      - ".gitmodules"
      - "src/runtime_manager/**"
      - "src/core/diagnostics.py"
      - "tools/manage_runtime.py"
      - "tools/check_dlss_sr_readiness.py"
      - "tools/validate_dlssg_candidate.py"
      - ".github/workflows/fresh-source-install.yml"
  pull_request:
    paths:
      - "setup.bat"
      - "start.bat"
      - "environment.yml"
      - "requirements.txt"
      - ".gitmodules"
      - "src/runtime_manager/**"
      - "src/core/diagnostics.py"
      - "tools/manage_runtime.py"
      - "tools/check_dlss_sr_readiness.py"
      - "tools/validate_dlssg_candidate.py"
      - ".github/workflows/fresh-source-install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clone-setup-start:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      NVE_SETUP_DLSS5: "0"

    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Provision assumed machine prerequisites for CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $condaRoot = Join-Path $env:RUNNER_TEMP 'miniconda'
          $installer = Join-Path $env:RUNNER_TEMP 'Miniconda3.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://repo.anaconda.com/miniconda/Miniconda3-latest-Windows-x86_64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @('/InstallationType=JustMe','/RegisterPython=0','/AddToPath=0','/S',"/D=$condaRoot")
          if ($process.ExitCode -ne 0) { throw "Miniconda installer failed: $($process.ExitCode)" }
          $env:Path = "$condaRoot;$condaRoot\Scripts;$condaRoot\condabin;$env:Path"
          "$condaRoot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$condaRoot\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$condaRoot\condabin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          conda --version

          $haveFfmpeg = $null -ne (Get-Command ffmpeg -ErrorAction SilentlyContinue)
          $haveNvenc = $false
          if ($haveFfmpeg) {
            $encoders = (& ffmpeg -hide_banner -encoders 2>&1 | Out-String)
            $haveNvenc = $encoders.Contains('h264_nvenc') -and $encoders.Contains('hevc_nvenc')
          }
          if (-not $haveNvenc) {
            $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-full.7z'
            $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-full'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z' -OutFile $archive
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            & 7z x $archive "-o$extract" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7-Zip failed extracting FFmpeg: $LASTEXITCODE" }
            $ffmpegExe = Get-ChildItem -Path $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
            if (-not $ffmpegExe) { throw 'Downloaded FFmpeg archive did not contain ffmpeg.exe' }
            $ffmpegBin = $ffmpegExe.Directory.FullName
            $env:Path = "$ffmpegBin;$env:Path"
            $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
          $encoders = (& ffmpeg -hide_banner -encoders 2>&1 | Out-String)
          if (-not $encoders.Contains('h264_nvenc') -or -not $encoders.Contains('hevc_nvenc')) { throw 'CI prerequisite FFmpeg does not expose h264_nvenc and hevc_nvenc' }
          git --version

      - name: Clone current revision exactly like a new source user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clone = Join-Path $env:RUNNER_TEMP 'fresh-source'
          git clone --recurse-submodules "https://github.com/$env:GITHUB_REPOSITORY.git" $clone
          if ($LASTEXITCODE -ne 0) { throw "git clone failed: $LASTEXITCODE" }
          git -C $clone fetch origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git fetch exact SHA failed: $LASTEXITCODE" }
          git -C $clone checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "git checkout exact SHA failed: $LASTEXITCODE" }
          git -C $clone submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "git submodule update failed: $LASTEXITCODE" }
          $submodule = git -C $clone submodule status --recursive
          Write-Host $submodule
          if ($submodule -notmatch '796ed5927a202ba50b5c929cd08e16b365041162') { throw 'Pinned ComfyUI-DLSS5-Enhancer submodule identity was not checked out' }
          "NVE_FRESH_CLONE=$clone" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run setup.bat from the fresh clone
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:NVE_FRESH_CLONE
          try {
            cmd.exe /d /c setup.bat
            if ($LASTEXITCODE -ne 0) { throw "setup.bat failed: $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

      - name: Verify setup produced the source-launch contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:NVE_FRESH_CLONE
          $required = @(
            'config\source_env.bat',
            'runtime\dlssg\worker\dlssg_sm86_offline.exe',
            'runtime\dlssg\grid4-worker\dlssg_sm86_offline.exe',
            'runtime\dlssg\legacy\version.dll',
            'runtime\dlssg\legacy\dlssg_sm86.ini',
            'runtime\dlssg\official\nvngx_dlssg.dll',
            'runtime\dlss-sr-host\dlss_sr_host.exe',
            'runtime\dlss-sr-host\nvngx_dlss.dll'
          )
          foreach ($relative in $required) {
            $path = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "setup.bat did not produce required file: $relative" }
          }
          $sourceEnv = Get-Content -LiteralPath (Join-Path $root 'config\source_env.bat') -Raw
          foreach ($needle in @('NVE_CONDA_EXE=', 'NVE_CONDA_ENV=', 'DLSSG_WORKER_EXE=', 'DLSSG_COMMUNITY_RUNTIME=', 'DLSSG_OFFICIAL_RUNTIME_DIR=')) {
            if (-not $sourceEnv.Contains($needle)) { throw "source_env.bat missing $needle" }
          }

      - name: Run start.bat and require the localhost UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'nve-start.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'nve-start.stderr.log'

          # Prove start.bat can reuse the Conda executable persisted by setup,
          # rather than succeeding only because this CI shell still has Conda on PATH.
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and $_ -notmatch '(?i)(miniconda|anaconda|condabin)' }) -join ';'
          if (Get-Command conda -ErrorAction SilentlyContinue) {
            throw 'Conda is still discoverable on PATH; remembered-Conda startup is not being tested'
          }

          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/c','start.bat') -WorkingDirectory $env:NVE_FRESH_CLONE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { break }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:7860/' -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 750
              }
            }
            if (-not $ready) {
              Write-Host '--- start.bat stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '--- start.bat stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'start.bat did not serve http://127.0.0.1:7860/ within 90 seconds'
            }
            Write-Host 'FRESH_SOURCE_INSTALL_PASS clone=recursive setup=success start=http://127.0.0.1:7860/'
          }
          finally {
            if (-not $process.HasExited) { taskkill.exe /PID $process.Id /T /F | Out-Null }
          }
