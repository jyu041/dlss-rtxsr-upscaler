name: ordinary-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ordinary test dependencies
        shell: pwsh
        run: python -m pip install --extra-index-url https://pypi.nvidia.com --extra-index-url https://download.pytorch.org/whl/cu128 -r requirements-test.txt
      - name: Compile source
        run: python -m compileall -q src tools
      - name: Run ordinary tests
        run: python -m pytest -q
