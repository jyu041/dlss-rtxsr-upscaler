name: prune-merged-branches

# Runs when this maintenance workflow changes on main and after a PR is merged.
# It never deletes main or an open-PR branch. pull_request_target is safe here:
# the workflow never checks out or executes pull-request code.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prune-merged-branches.yml"
  pull_request_target:
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          echo "Default branch: $default_branch"

          mapfile -t merged_branches < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100"               --jq '.[] | select(.merged_at != null and .head.repo.full_name == "jyu041/dlss-rtxsr-upscaler") | .head.ref'
          )

          mapfile -t candidates < <(
            printf '%s\n' "${merged_branches[@]}" |
              sed '/^$/d' |
              sort -u
          )

          deleted=0
          skipped=0
          for candidate in "${candidates[@]}"; do
            if [ "$candidate" = "$default_branch" ]; then
              echo "SKIP default branch: $candidate"
              skipped=$((skipped + 1))
              continue
            fi

            open_prs="$(gh pr list               --repo "$GITHUB_REPOSITORY"               --head "$candidate"               --state open               --json number               --jq 'length')"
            if [ "$open_prs" != "0" ]; then
              echo "SKIP open-PR branch: $candidate"
              skipped=$((skipped + 1))
              continue
            fi

            encoded="$(jq -rn --arg value "$candidate" '$value|@uri')"
            if ! gh api "repos/$GITHUB_REPOSITORY/branches/$encoded" >/dev/null 2>&1; then
              echo "ALREADY ABSENT: $candidate"
              continue
            fi

            echo "DELETE: $candidate"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$candidate"
            deleted=$((deleted + 1))
          done

          echo "BRANCH_PRUNE_PASS deleted=$deleted skipped=$skipped"
          echo "Remaining branches:"
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
