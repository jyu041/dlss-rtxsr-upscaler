name: publish-v0.2.0-beta.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.2.0-beta.1.yml"
      - "docs/RELEASE_NOTES_v0.2.0-beta.1.md"
      - "README.md"
      - "docs/PROJECT_STATUS.md"
      - "docs/README.md"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: "v0.2.0-beta.1"
      TITLE: "NVIDIA Video Enhancer v0.2.0-beta.1"

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip if the prerelease already exists
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            test "$is_prerelease" = "true"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists and is a prerelease; nothing to republish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for ordinary tests on this exact main commit
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ordinary-tests.yml/runs?branch=main&event=push&head_sha=$GITHUB_SHA&per_page=10")"
            count="$(printf '%s' "$payload" | jq '.workflow_runs | length')"
            if [ "$count" -gt 0 ]; then
              status="$(printf '%s' "$payload" | jq -r '.workflow_runs[0].status')"
              conclusion="$(printf '%s' "$payload" | jq -r '.workflow_runs[0].conclusion // ""')"
              run_url="$(printf '%s' "$payload" | jq -r '.workflow_runs[0].html_url')"
              echo "ordinary-tests status=$status conclusion=$conclusion run=$run_url"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "ordinary-tests did not succeed for $GITHUB_SHA" >&2
                exit 1
              fi
            else
              echo "Waiting for ordinary-tests run to appear for $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "Timed out waiting for ordinary-tests on $GITHUB_SHA" >&2
          exit 1

      - name: Verify release-note contract
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/RELEASE_NOTES_v0.2.0-beta.1.md
          grep -Fq 'validated source-install workflow' docs/RELEASE_NOTES_v0.2.0-beta.1.md
          grep -Fq 'does **not** include a no-Conda portable application bundle' docs/RELEASE_NOTES_v0.2.0-beta.1.md
          grep -Fq 'DLSS 5 v10 Experimental' docs/RELEASE_NOTES_v0.2.0-beta.1.md

      - name: Publish source-install prerelease
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cp docs/RELEASE_NOTES_v0.2.0-beta.1.md "$notes"
          printf '\n\n---\n\nRelease commit: `%s`\n' "$GITHUB_SHA" >> "$notes"

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$TITLE"             --prerelease             --notes-file "$notes"

      - name: Verify published prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url,targetCommitish,assets)"
          echo "$release_json"
          test "$(printf '%s' "$release_json" | jq -r '.tagName')" = "$TAG"
          test "$(printf '%s' "$release_json" | jq -r '.isPrerelease')" = "true"
