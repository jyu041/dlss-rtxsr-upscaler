name: publish-v0.2.0-beta.3

on:
  push:
    branches:
      - main
    paths:
      - "docs/RELEASE_NOTES_v0.2.0-beta.3.md"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'jyu041/dlss-rtxsr-upscaler'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7

      - name: Publish prerelease if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.2.0-beta.3"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file docs/RELEASE_NOTES_v0.2.0-beta.3.md \
            --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"
