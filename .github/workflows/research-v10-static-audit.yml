name: research-v10-static-audit

on:
  push:
    branches:
      - research/mfg-0.3.3-dlss5-v10
    paths:
      - .github/workflows/research-v10-static-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and statically audit exact v10 archive
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dlss5-v10-static.json'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\audit_dlss5_v10.ps1 -Output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "AUDIT_JSON=$output"

      - name: Verify audit says nothing executed
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dlss5-v10-static.json'
          $report = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          if ($report.executed -ne $false) { throw 'Static audit execution invariant failed.' }
          if ($report.static_only -ne $true) { throw 'Static-only invariant failed.' }
          Write-Host "STATIC_ONLY_PASS files=$($report.files.Count)"

      - name: Upload JSON evidence only
        uses: actions/upload-artifact@v4
        with:
          name: dlss5-v10-static-evidence
          path: ${{ runner.temp }}\dlss5-v10-static.json
          if-no-files-found: error
          retention-days: 7
